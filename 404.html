<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MemoHeart</title>
<meta name="description" content="MemoHeart, l'application pour garder la mémoire de ceux qu'on aime : leur histoire, leurs photos et les anecdotes racontées par la famille.">
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg: #283638; --text: #f4f1e8; --muted: #b9bfbb; --gold: #c7ab72; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 20px calc(32px + env(safe-area-inset-bottom, 0px));
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { max-width: 34rem; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  img { width: 132px; height: auto; }
  h1 { margin: 0; font: 400 clamp(30px, 8vw, 42px)/1.1 Georgia, "Times New Roman", serif; letter-spacing: 2px; }
  h1 span { color: var(--gold); }
  .slogan { margin: -8px 0 8px; color: var(--muted); font-size: 15px; letter-spacing: .3px; }
  p { margin: 0; }
  .soon { margin-top: 10px; padding: 10px 18px; border: 1px solid rgba(199,171,114,.45); border-radius: 999px; color: var(--gold); font-size: 14px; font-weight: 600; letter-spacing: .4px; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13.5px; }
  a { color: var(--gold); }
</style>
</head>
<body>
<main>
  <img src="/symbole.png" alt="" width="132" height="132">
  <h1>MEMO<span>HEART</span></h1>
  <p class="slogan">Ils vivent tant qu'on les raconte.</p>
  <p id="msg">Cette page n'existe pas.</p>
  <p class="soon" id="back"><a href="/" style="text-decoration:none">Retour à l'accueil</a></p>
</main>
<footer>Contact&nbsp;: <a data-u="contact" data-d="memoheart.fr">contact [arobase] memoheart.fr</a></footer>
<script src="/em.js" defer></script>
<script>
// Bouton « Ouvrir MemoHeart » d'un e-mail de notification, ouvert sur un
// appareil où l'app n'est pas installée (sinon l'app s'ouvre directement).
if (/^\/n\//.test(location.pathname)) {
  var texts = {
    fr: "Ouvrez l'application MemoHeart sur votre téléphone pour voir cette notification.",
    en: 'Open the MemoHeart app on your phone to see this notification.',
    es: 'Abre la app MemoHeart en tu teléfono para ver esta notificación.',
    de: 'Öffne die MemoHeart-App auf deinem Telefon, um diese Benachrichtigung zu sehen.',
    it: "Apri l'app MemoHeart sul telefono per vedere questa notifica.",
    zh: '请在手机上打开 MemoHeart 应用查看此通知。',
    he: 'פתחו את אפליקציית MemoHeart בטלפון כדי לראות את ההתראה.',
    ar: 'افتح تطبيق MemoHeart على هاتفك لرؤية هذا الإشعار.'
  };
  var lang = (navigator.language || 'fr').slice(0, 2);
  document.getElementById('msg').textContent = texts[lang] || texts.en;
  if (lang === 'he' || lang === 'ar') document.getElementById('msg').dir = 'rtl';
  document.getElementById('back').hidden = true;
}

// Code à scanner d'un livre souvenir, ouvert sur un appareil sans l'app.
if (/^\/f\//.test(location.pathname)) {
  var ficheTexts = {
    fr: "Ouvrez ce lien depuis un téléphone où l'application MemoHeart est installée pour écouter cette anecdote. Seuls les membres de la fiche peuvent l'écouter ; vous pourrez en demander l'accès.",
    en: 'Open this link on a phone where the MemoHeart app is installed to listen to this story. Only members of the fiche can listen; you can ask for access.',
    es: 'Abre este enlace en un teléfono con la app MemoHeart instalada para escuchar esta anécdota. Solo los miembros de la ficha pueden escucharla; podrás pedir acceso.',
    de: 'Öffne diesen Link auf einem Telefon mit der MemoHeart-App, um diese Anekdote zu hören. Nur Mitglieder der Fiche können sie hören; du kannst den Zugang anfragen.',
    it: "Apri questo link su un telefono con l'app MemoHeart installata per ascoltare questo aneddoto. Solo i membri della scheda possono ascoltarlo; potrai chiedere l'accesso.",
    zh: '请在已安装 MemoHeart 应用的手机上打开此链接收听这则故事。只有档案成员可以收听，您可以申请访问。',
    he: 'פתחו את הקישור בטלפון שבו מותקנת אפליקציית MemoHeart כדי להאזין לסיפור. רק חברי הכרטיס יכולים להאזין; אפשר לבקש גישה.',
    ar: 'افتح هذا الرابط على هاتف مثبّت عليه تطبيق MemoHeart للاستماع إلى هذه الحكاية. يستطيع أعضاء البطاقة فقط الاستماع، ويمكنك طلب الوصول.'
  };
  var fLang = (navigator.language || 'fr').slice(0, 2);
  document.getElementById('msg').textContent = ficheTexts[fLang] || ficheTexts.en;
  if (fLang === 'he' || fLang === 'ar') document.getElementById('msg').dir = 'rtl';
  document.getElementById('back').hidden = true;
}
</script>
</body>
</html>
